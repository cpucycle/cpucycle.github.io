<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cpucycle</title>
<meta name="description" content="cpucycle.com">
<meta name="robots" content="index,follow">
<style>
  :root { --bg:#0b0d0c; --fg:#c9d4cc; --dim:#5d6a62; --acc:#7CFFB2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:2rem; text-align:center;
  }
  .ring { width:96px; height:96px; margin-bottom:2rem; }
  .ring circle { fill:none; stroke-width:2; }
  .ring .track { stroke:#1b221e; }
  .ring .arc { stroke:var(--acc); stroke-linecap:round; stroke-dasharray:60 241;
               transform-origin:50% 50%; animation:spin 2.4s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-weight:500; font-size:1.6rem; letter-spacing:.12em; }
  h1 span { color:var(--acc); }
  .tag { color:var(--dim); margin-top:.5rem; }
  .cur { display:inline-block; width:.6ch; height:1.1em; background:var(--acc);
         vertical-align:-.15em; margin-left:.3ch; animation:blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .count { margin-top:2.5rem; color:var(--dim); font-size:.8rem; letter-spacing:.08em; }
  .count b { color:var(--fg); font-weight:400; font-variant-numeric:tabular-nums; }
  @media (prefers-reduced-motion:reduce) { .ring .arc,.cur { animation:none; } }
</style>
</head>
<body>
  <svg class="ring" viewBox="0 0 96 96" aria-hidden="true">
    <circle class="track" cx="48" cy="48" r="38"/>
    <circle class="arc" cx="48" cy="48" r="38"/>
  </svg>
  <h1>cpu<span>cycle</span></h1>
  <p class="tag">something is running.<span class="cur"></span></p>
  <p class="count">cycles since you arrived: <b id="n">0</b></p>
<script>
  // Fake-but-fun tick counter: ~3 GHz worth of cycles, scaled to elapsed time.
  const el = document.getElementById('n'), t0 = performance.now();
  (function tick(){
    const cycles = Math.floor((performance.now() - t0) * 3e6);
    el.textContent = cycles.toLocaleString('en-US');
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
